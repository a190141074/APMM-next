[package]
name = "astral-mod-manager"
version = "0.4.10"
license = "GPL-3.0-only"
description = "Astral Party 贴图管理与切换工具"
edition = "2021"
default-run = "astral-mod-manager"

[lib]
name = "astral_mod_manager_lib"
# The Windows desktop binary links this crate directly.
crate-type = ["rlib"]

[[bin]]
name = "astral-mod-manager"
path = "src/main.rs"

[[bin]]
name = "astral-updater"
path = "src/bin/astral-updater.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
semver = "1"
# Keep the standard Tauri Windows feature set. The MSVC toolchain provides the
# Windows resource compiler and Common Controls manifest normally.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
ed25519-dalek = "2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_IO", "Win32_Security", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_ApplicationInstallationAndServicing", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[patch.crates-io]
# The dialog plugin enables rfd's TaskDialogIndirect path unconditionally on
# Windows. Use the vendored compatibility branch (MessageBoxW) so the EXE
# remains runnable even when an embedded SxS manifest is unavailable.
rfd = { path = "../vendor/rfd" }
tauri-winres = { path = "../vendor/tauri-winres" }
