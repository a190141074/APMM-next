[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apmm-util"
version = "0.1.0"
description = "Astral Party 游戏资产自动索引与增量提取工具"
requires-python = ">=3.12"
dependencies = ["UnityPy==1.25.4", "Pillow==12.3.0"]

[project.scripts]
apmm-util = "apmm_util.cli:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

